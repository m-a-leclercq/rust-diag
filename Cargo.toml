[package]
name = "rust-diags"
version = "0.1.0"
edition = "2024"

[dependencies]
elasticsearch = "9.1.0-alpha.1"
serde = { version = "~1", features = ["derive"] }
serde_json = "~1"
serde_yaml = "0.9"
tokio = { version = "*", features = ["full"] }
clap = { version = "4", features = ["derive"] }
semver = "1"
zip = "2"
walkdir = "2"
chrono = "0.4"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
indexmap = { version = "2", features = ["serde"] }
url = "2"
